<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Letters For You</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0d0d0d;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 40px 25px;
}

.container {
    max-width: 600px;
    margin: auto;
}

h1 {
    font-weight: 400;
    font-size: 40px;
    text-align: center;
    margin-top: 40px;
}

.subtitle {
    text-align: center;
    color: #999;
    margin-top: 15px;
    margin-bottom: 60px;
    line-height: 1.6;
}

.letter {
    display: block;
    border: 1px solid #444;
    padding: 25px;
    margin-bottom: 20px;
    text-decoration: none;
    color: white;
    transition: 0.3s;
}

.letter:hover {
    background: #181818;
}

.letter h2 {
    font-size: 20px;
    font-weight: 400;
}

.letter p {
    color: #888;
    margin-top: 10px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 50px;
    color: #888;
    text-decoration: none;
}
</style>

</head>

<body>

<div class="container">

<h1>Letters For You.</h1>

<p class="subtitle">
Some things were easier to write than to say.
</p>

<a href="#" class="letter">
<h2>Letter One</h2>
<p>For the things I never said.</p>
</a>

<a href="#" class="letter">
<h2>Letter Two</h2>
<p>For the memories I still remember.</p>
</a>

<a href="#" class="letter">
<h2>Letter Three</h2>
<p>For when you need to know why.</p>
</a>

<a href="index.html" class="back">
← Back
</a>

</div>

</body>
</html>
